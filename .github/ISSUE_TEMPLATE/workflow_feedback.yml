name: Share workflow feedback
description: Tell us about the task you tried and whether NativePrep helped
body:
  - type: textarea
    id: task
    attributes:
      label: What task did you try?
      description: Describe your workflow without naming clients or sharing private data.
    validations:
      required: true
  - type: dropdown
    id: completed
    attributes:
      label: Did you finish the task?
      options:
        - "Yes"
        - Partly
        - "No"
    validations:
      required: true
  - type: textarea
    id: obstacles
    attributes:
      label: What worked and what got in the way?
  - type: textarea
    id: return
    attributes:
      label: Would you use it for your next dataset? Why?
